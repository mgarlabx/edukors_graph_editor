[package]
name = "edukors-editor"
version = "2.14.0"
description = "Editor visual de cursos Edukors Graph"
authors = ["Edukors"]
license = "MIT"
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "edukors_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
keyring = { version = "3", features = ["apple-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# The Edit menu without the items macOS adds to it (src/macos.rs).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"

# The Windows Credential Manager for the key, one window for every course
# opened from Explorer, and whether the app came from the Store (see run() in src/lib.rs).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
tauri-plugin-single-instance = "2"
windows-sys = { version = "0.61", features = ["Win32_Storage_Packaging_Appx"] }

# The desktop's keyring (GNOME Keyring, KWallet) through the Secret Service,
# and, as on Windows, one window for every course opened from the file manager.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
tauri-plugin-single-instance = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
