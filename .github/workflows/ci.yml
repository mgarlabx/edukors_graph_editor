# The checks, on every branch and pull request, on the three systems the app
# ships for: the types, the tests (the agent panel included, against the real
# EDUKORS AI library host with its fake provider), the interface build, the
# agent bundle and the Rust tests. Nothing is signed, built into an installer or
# published here; that is release.yml's.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # 22.04, as in release.yml: the oldest Ubuntu GitHub has.
        platform: [macos-latest, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # What Tauri builds on (WebKitGTK and the rest) and the keyring's D-Bus.
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf xdg-utils

      - name: Types
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      - name: Interface build
        run: npx vite build

      - name: Agent bundle
        run: node scripts/stage-agent.mjs

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
