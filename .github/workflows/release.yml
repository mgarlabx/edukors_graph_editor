name: Release

# A tag vX.Y.Z builds, signs, notarizes and publishes the installers in a release, at once, and sends the Windows
# package to the Microsoft Store (store.yml). package.json must already hold X.Y.Z (scripts/build.mjs: YY.M.D) and
# CHANGELOG.md its section (scripts/release-notes.mjs). A tag vX.Y.Z-rc.N makes a pre-release, without the Store.
#
#   git tag v26.11.5 && git push origin v26.11.5
#
# Pull requests that touch packaging, and runs by hand (Actions → Release → Run workflow), build the installers too
# and run the same checks, without publishing: a run by hand gives store.yml a package of package.json's version.
#
# The release also carries the latest.json that the 2.x versions (Tauri) read, so they update to this one
# (scripts/tauri-update.mjs); on Windows and Linux, installing over the real v2.20.0 is checked on every run.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    paths: [electron-builder.yml, build/**, scripts/package.mjs, scripts/public-installers.mjs, scripts/tauri-update.mjs, scripts/build.mjs, package.json, package-lock.json, .github/workflows/release.yml]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      base: ${{ steps.v.outputs.base }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        run: |
          pkg=$(node -p "require('./package.json').version")
          node scripts/release-notes.mjs "$pkg" > /dev/null
          if [ "$GITHUB_REF_TYPE" != tag ]; then
            { echo "version=$pkg"; echo "base=$pkg"; echo "prerelease=true"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"; base="${tag%%-*}"
          if [ "$base" != "$pkg" ]; then echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($pkg)"; exit 1; fi
          { echo "version=$tag"; echo "base=$base"; } >> "$GITHUB_OUTPUT"
          if [ "$tag" != "$base" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  build:
    needs: check
    name: build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: mac, os: macos-latest, args: --universal}
          - {name: win, os: windows-latest, args: --x64}
          - {name: linux-x64, os: ubuntu-latest, args: --x64}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    env:
      HAS_MAC_CERT: ${{ secrets.APPLE_CERTIFICATE != '' }}
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Version from the tag
        shell: bash
        run: node -e "const f='package.json',p=JSON.parse(require('fs').readFileSync(f));p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
      - name: Build
        run: node scripts/build.mjs --no-bump
      - name: Without a certificate, macOS builds are signed ad hoc (Gatekeeper will warn)
        if: runner.os == 'macOS' && env.HAS_MAC_CERT != 'true'
        run: echo "BUILDER_ARGS=-c.mac.identity=- -c.mac.hardenedRuntime=false" >> "$GITHUB_ENV"
      # Developer ID signing (CSC_LINK takes the base64 .p12) and notarization by electron-builder (APPLE_API_KEY is
      # the .p8's path, APPLE_API_KEY_ID its id). The secrets keep the names they had for Tauri: APPLE_CERTIFICATE
      # (.p12, base64), APPLE_API_KEY (the key id) and APPLE_API_KEY_P8 (the key itself).
      # Only on macOS: electron-builder would otherwise try the .p12 for Windows signing.
      - name: Signing and notarization credentials
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"; printf '%s\n' "$API_KEY_P8" > "$key"
          { echo "CSC_LINK=$P12"; echo "CSC_KEY_PASSWORD=$P12_PASSWORD"; echo "APPLE_API_KEY=$key"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"; echo "APPLE_API_ISSUER=$API_ISSUER"; } >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ env.HAS_MAC_CERT == 'true' }}
        run: node scripts/package.mjs ${{ matrix.args }} $BUILDER_ARGS

      - name: Check universal Mac executable
        if: runner.os == 'macOS'
        run: |
          archs=" $(lipo -archs "release/mac-universal/Edukors Graph Editor.app/Contents/MacOS/Edukors Graph Editor") "
          echo "Architectures:$archs"
          [[ "$archs" == *" x86_64 "* && "$archs" == *" arm64 "* ]]
      - name: Check signature and notarization
        if: runner.os == 'macOS' && env.HAS_MAC_CERT == 'true'
        run: |
          app="release/mac-universal/Edukors Graph Editor.app"
          codesign --verify --deep --strict "$app" && xcrun stapler validate "$app" && spctl -a -vv -t exec "$app"
          # The .dmg itself, notarized and stapled, so it opens without a warning when downloaded.
          dmg="release/Edukors-Graph-Editor-$VERSION-mac-universal.dmg"
          xcrun notarytool submit "$dmg" --key "$APPLE_API_KEY" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "$dmg"
          spctl -a -vv -t open --context context:primary-signature "$dmg"
      # For the 2.x updater (scripts/tauri-update.mjs): the notarized .app, the archive's first level being the .app
      # (the updater puts what is inside it in place of the old app). Without macOS metadata (no ._ files).
      - name: The .app for the 2.x updater
        if: runner.os == 'macOS'
        run: |
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf "release/Edukors-Graph-Editor-$VERSION-mac-universal.app.tar.gz" -C release/mac-universal "Edukors Graph Editor.app"
          mkdir "$RUNNER_TEMP/x" && tar -xzf "release/Edukors-Graph-Editor-$VERSION-mac-universal.app.tar.gz" -C "$RUNNER_TEMP/x"
          codesign --verify --deep --strict "$RUNNER_TEMP/x/Edukors Graph Editor.app"

      # Whoever has 2.20 installed by its own installer gets this one over it (from the 2.x updater or by hand): the
      # old app removed (build/installer.nsh), its data kept for the migration, this one installed and starting.
      - name: Install over 2.20 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Edukors Graph Editor'
          gh release download v2.20.0 -R $env:GITHUB_REPOSITORY -p 'Edukors.Graph.Editor_2.20.0_x64-setup.exe' -D $env:RUNNER_TEMP
          Start-Process "$env:RUNNER_TEMP\Edukors.Graph.Editor_2.20.0_x64-setup.exe" -ArgumentList '/S' -Wait
          $old = (Get-ItemProperty $key).InstallLocation.Trim('"')
          Write-Host "2.20 installed in $old"
          if (-not (Test-Path "$old\uninstall.exe")) { throw '2.20 did not install' }
          $data = "$env:APPDATA\org.edukors.grapheditor"
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content "$data\prefs.json" '{"locale":"en"}'
          Start-Process "release\Edukors-Graph-Editor-$env:VERSION-setup.exe" -ArgumentList '/S' -Wait
          if (Test-Path $key) { throw 'the 2.20 uninstall entry is still there' }
          if (Test-Path "$old\uninstall.exe") { throw "2.20 is still in $old" }
          if (-not (Test-Path "$data\prefs.json")) { throw "the 2.20 data was removed" }
          $exe = "$env:LOCALAPPDATA\Programs\edukors-graph-editor\Edukors Graph Editor.exe"
          if (-not (Test-Path $exe)) { throw "the new app is not in $exe" }
          $lnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Edukors Graph Editor.lnk"
          if (-not (Test-Path $lnk)) { throw 'no Start menu shortcut' }
          Write-Host "ok: 2.20 removed, its data kept, $exe installed"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Install over 2.20 (Linux .deb)
        if: runner.os == 'Linux'
        run: |
          gh release download v2.20.0 -R "$GITHUB_REPOSITORY" -p 'Edukors.Graph.Editor_2.20.0_amd64.deb' -D "$RUNNER_TEMP"
          sudo apt-get update -q
          sudo apt-get install -y -q "$RUNNER_TEMP/Edukors.Graph.Editor_2.20.0_amd64.deb"
          dpkg -s edukors-graph-editor | grep '^Version: 2.20.0'
          sudo apt-get install -y -q "./release/Edukors-Graph-Editor-$VERSION-linux-amd64.deb"
          dpkg -s edukors-graph-editor | grep "^Version: $VERSION"
          test -x "$(readlink -f /usr/bin/edukors-graph-editor)"
          grep -q 'application/vnd.edukors.graph+zip' /usr/share/applications/edukors-graph-editor.desktop
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-${{ matrix.name }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.app.tar.gz
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
          if-no-files-found: error
          retention-days: 7
      - name: Microsoft Store package (sent to Partner Center by the store job)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-msix
          path: release/*.appx
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: [check, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          path: files
          merge-multiple: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Public installer names (keep the versioned originals)
        run: node scripts/public-installers.mjs files "$VERSION"
      # The 2.x updater's signatures, with its key (minisign, through the Tauri CLI the 2.x versions were built with),
      # then latest.json, which checks each signature against the 2.x public key.
      - name: Update for the 2.x versions (latest.json)
        if: needs.check.outputs.prerelease == 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in mac-universal.app.tar.gz setup.exe linux-x86_64.AppImage linux-amd64.deb; do
            npx --yes @tauri-apps/cli@2.12.1 signer sign "files/Edukors-Graph-Editor-$VERSION-$f"
          done
          node scripts/tauri-update.mjs files "$VERSION" "$GITHUB_REF_NAME"
      - name: Checksums
        working-directory: files
        run: sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: files/*
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "${{ needs.check.outputs.base }}" > notes.md
          pre=""; if [ "${{ needs.check.outputs.prerelease }}" = true ]; then pre="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" files/* -R "$GITHUB_REPOSITORY" $pre --verify-tag \
            --title "Edukors Graph Editor $VERSION" --notes-file notes.md

  # The Windows package to the Microsoft Store (store.yml), once the GitHub release is out: the Store never gets a
  # version the release (notarized Mac app, latest.json for the 2.x versions) does not have. Final versions only: a
  # pre-release's package would carry the same X.Y.Z.0 as the final one.
  store:
    needs: [check, publish]
    if: needs.check.outputs.prerelease == 'false'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/store.yml
    secrets: inherit
