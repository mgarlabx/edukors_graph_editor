# The release: the Mac app (universal), the Windows installer and the Linux
# AppImage and .deb, built on GitHub's machines, with what the updater needs
# (the .app.tar.gz, the installers' signatures, latest.json), in a draft release. Nothing reaches the
# installed apps until the draft is published.
#
#   git tag v2.12.0 && git push origin v2.12.0
#
# The tag must match the version in package.json, src-tauri/tauri.conf.json and
# src-tauri/Cargo.toml (scripts/bump-version.mjs), and CHANGELOG.md must have
# its section (scripts/release-notes.mjs). Run by hand (Actions → Release → Run
# workflow), it makes a draft of the version in package.json: for trying the
# workflow out in a fork.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}

jobs:
  # One draft for all builds: each making its own could leave several.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${VERSION}" ]; then
            echo "::error::the tag ${GITHUB_REF_NAME} is not the version in package.json (v${VERSION})"; exit 1
          fi
          if [ "${CONF}" != "${VERSION}" ] || [ "${CARGO}" != "${VERSION}" ]; then
            echo "::error::package.json (${VERSION}), tauri.conf.json (${CONF}) and Cargo.toml (${CARGO}) differ: run scripts/bump-version.mjs"; exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # The app checks each update against this key: a build without it could never be updated.
      - run: |
          node -e "const k = require('./src-tauri/tauri.conf.json').plugins.updater.pubkey; if (!k || k.startsWith('PENDENTE')) { console.error('::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is not set'); process.exit(1) }"

      - run: node scripts/release-notes.mjs ${{ steps.version.outputs.version }} > release-notes.md

      - id: create
        uses: actions/github-script@v7
        env:
          VERSION: ${{ steps.version.outputs.version }}
        with:
          script: |
            const body = require('fs').readFileSync('release-notes.md', 'utf8');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${process.env.VERSION}`,
              target_commitish: context.sha,
              name: `v${process.env.VERSION}`,
              body,
              draft: true,
            });
            return data.id;

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            installer: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*_{version}_universal.dmg
            download: Edukors-Graph-Editor-mac.dmg
          - platform: windows-latest
            args: ''
            installer: src-tauri/target/release/bundle/nsis/*_{version}_x64-setup.exe
            download: Edukors-Graph-Editor-windows.exe
          # 22.04, the oldest Ubuntu GitHub has: what is built against its glibc
          # also runs on the newer distributions.
          - platform: ubuntu-22.04
            args: ''
            installer: src-tauri/target/release/bundle/appimage/*_{version}_amd64.AppImage
            download: Edukors-Graph-Editor-linux.AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # What Tauri builds on (WebKitGTK and the rest) and the keyring's D-Bus.
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev patchelf xdg-utils

      # The Apple credentials, for Tauri to sign and notarize the app: only when
      # the secrets are there, so that a fork without them still builds, unsigned.
      # tauri-action imports APPLE_CERTIFICATE (the .p12, in base64) into a keychain
      # of its own; notarization uses the App Store Connect API key (docs/distribution.md).
      - if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::no Apple certificate: the Mac app will not be signed"; exit 0
          fi
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          {
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
            echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
            echo "APPLE_API_KEY=$APPLE_API_KEY"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
          } >> "$GITHUB_ENV"

      # Builds the interface, stages the agent (scripts/stage-agent.mjs: on the Mac
      # both claude binaries, on Windows claude.exe, on Linux the linux-x64 one),
      # makes the app or the installers with their updater signatures, and uploads
      # them to the draft. latest.json is the last job's, written once all builds are in.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
          args: --config src-tauri/tauri.bundle.conf.json --config src-tauri/tauri.release.conf.json ${{ matrix.args }}

      # Tauri notarizes the .app (and the .app.tar.gz the updater gets is made from
      # it) but only signs the .dmg: notarized and stapled here, it opens without a
      # warning when downloaded, and replaces the copy tauri-action put in the draft.
      - if: matrix.platform == 'macos-latest' && env.APPLE_API_KEY_PATH != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          dmg=( src-tauri/target/universal-apple-darwin/release/bundle/dmg/*_${VERSION}_universal.dmg )
          xcrun notarytool submit "${dmg[0]}" --key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY" --issuer "$APPLE_API_ISSUER" --wait
          xcrun stapler staple "${dmg[0]}"
          asset=$(gh api --paginate "repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
            --jq ".[] | select(.name | endswith(\"_${VERSION}_universal.dmg\")) | \"\(.id) \(.name)\"")
          if [ "$(printf '%s\n' "$asset" | grep -c .)" -ne 1 ]; then
            echo "::error::expected one .dmg in the draft, found: $asset"; exit 1
          fi
          gh api -X DELETE "repos/${{ github.repository }}/releases/assets/${asset%% *}"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@${dmg[0]}" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets?name=${asset#* }" > /dev/null

      # The installer once more, under a name without the version, for links that
      # always give the latest: releases/latest/download/Edukors-Graph-Editor-mac.dmg,
      # …-windows.exe, …-linux.AppImage and …-linux.deb (docs/distribution.md).
      - shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          upload() {
            # This version's only: the build cache may hold an older one.
            local pattern="${1//\{version\}/$VERSION}"
            local files=( $pattern )
            if [ "${#files[@]}" -ne 1 ] || [ ! -f "${files[0]}" ]; then
              echo "::error::expected one installer at $pattern, found: ${files[*]}"; exit 1
            fi
            curl --fail-with-body -sS -X POST \
              -H "Authorization: Bearer ${GITHUB_TOKEN}" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${files[0]}" \
              "https://uploads.github.com/repos/${{ github.repository }}/releases/${{ needs.prepare.outputs.release_id }}/assets?name=$2" > /dev/null
          }
          upload '${{ matrix.installer }}' '${{ matrix.download }}'
          if [ '${{ matrix.platform }}' = ubuntu-22.04 ]; then
            upload 'src-tauri/target/release/bundle/deb/*_{version}_amd64.deb' Edukors-Graph-Editor-linux.deb
          fi

      # The same Windows app as an MSIX package, for the Microsoft Store, which
      # signs it: kept with the run's artifacts (not in the release, since the
      # package installs only from the Store), to be submitted in Partner Center.
      - if: matrix.platform == 'windows-latest'
        run: node scripts/make-msix.mjs

      - if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-store-msix
          path: src-tauri/target/Edukors-Graph-Editor-${{ needs.prepare.outputs.version }}.msix
          if-no-files-found: error

      # The universal app must carry the agent for both kinds of Mac, and, signed,
      # pass Gatekeeper as a download would: the app and the .dmg, both notarized.
      - if: matrix.platform == 'macos-latest'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          APP="$BUNDLE/macos/Edukors Graph Editor.app"
          SDK="$APP/Contents/Resources/agent/node_modules/@anthropic-ai"
          for arch in arm64 x64; do
            test -x "$SDK/claude-agent-sdk-darwin-$arch/claude" || { echo "::error::the app has no claude for darwin-$arch"; exit 1; }
          done
          if [ -n "$APPLE_API_KEY_PATH" ]; then
            spctl --assess --type execute --verbose "$APP"
            spctl --assess --type open --context context:primary-signature --verbose "$BUNDLE"/dmg/*_${VERSION}_universal.dmg
          fi

      # The .deb must carry the agent with Linux's claude, and the .egf type for
      # the file managers.
      - if: matrix.platform == 'ubuntu-22.04'
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          deb=( src-tauri/target/release/bundle/deb/*_${VERSION}_amd64.deb )
          dpkg-deb -c "${deb[0]}" > contents.txt
          grep -q 'agent/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude.gz$' contents.txt || { echo "::error::the .deb has no claude for linux-x64"; exit 1; }
          grep -q 'usr/share/mime/packages/edukors-graph-editor.xml$' contents.txt || { echo "::error::the .deb has no .egf type"; exit 1; }

  # latest.json, from the signatures the builds uploaded: written once, here,
  # since builds updating the same file could each drop another's platform.
  updater-json:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: node scripts/release-notes.mjs ${{ needs.prepare.outputs.version }} > release-notes.md

      - uses: actions/github-script@v7
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const release_id = Number(process.env.RELEASE_ID);
            const version = process.env.VERSION;
            const assets = await github.paginate(github.rest.repos.listReleaseAssets, { owner, repo, release_id, per_page: 100 });
            const named = (test) => {
              const found = assets.filter((a) => test(a.name));
              if (found.length !== 1) throw new Error(`expected one asset, found ${found.map((a) => a.name).join(', ') || 'none'}`);
              return found[0];
            };
            const signature = async (asset) => {
              const sig = named((n) => n === `${asset.name}.sig`);
              const { data } = await github.rest.repos.getReleaseAsset({ owner, repo, asset_id: sig.id, headers: { accept: 'application/octet-stream' } });
              return Buffer.from(data).toString('utf8').trim();
            };
            // A draft's own download links are temporary: these are the ones the tag will have once published.
            const url = (asset) => `https://github.com/${owner}/${repo}/releases/download/v${version}/${encodeURIComponent(asset.name)}`;

            const mac = named((n) => n.endsWith('.app.tar.gz'));
            const win = named((n) => /-setup\.exe$/.test(n));
            const macEntry = { url: url(mac), signature: await signature(mac) };
            const winEntry = { url: url(win), signature: await signature(win) };
            // The AppImage replaces itself; an editor installed from the .deb updates with
            // the .deb, which the updater looks for under linux-x86_64-deb first.
            const appImage = named((n) => n.endsWith(`_${version}_amd64.AppImage`));
            const deb = named((n) => n.endsWith(`_${version}_amd64.deb`));
            const linuxEntry = { url: url(appImage), signature: await signature(appImage) };
            const debEntry = { url: url(deb), signature: await signature(deb) };
            const latest = {
              version,
              notes: require('fs').readFileSync('release-notes.md', 'utf8').trim(),
              pub_date: new Date().toISOString(),
              platforms: {
                'darwin-aarch64': macEntry,
                'darwin-x86_64': macEntry,
                'windows-x86_64': winEntry,
                'linux-x86_64': linuxEntry,
                'linux-x86_64-deb': debEntry,
              },
            };
            for (const old of assets.filter((a) => a.name === 'latest.json')) {
              await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
            }
            await github.rest.repos.uploadReleaseAsset({
              owner, repo, release_id,
              name: 'latest.json',
              data: JSON.stringify(latest, null, 2),
              headers: { 'content-type': 'application/json' },
            });
            core.info(JSON.stringify(latest.platforms, null, 2));
